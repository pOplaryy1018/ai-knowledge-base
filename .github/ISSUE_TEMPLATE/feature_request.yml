name: ✨ 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "感谢你提出功能建议！"
  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 清晰简洁地描述需求背景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 描述你期望的功能或改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案
  - type: textarea
    id: additional
    attributes:
      label: 补充说明
