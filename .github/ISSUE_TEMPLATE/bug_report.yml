name: 🐛 Bug 报告
description: 报告一个 bug，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢你花时间提交 Bug 报告！"
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 你使用的是什么版本？
      placeholder: 如 v0.0.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述你遇到的问题
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 出现错误 '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果有截图，请附上
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: |
        - OS: Windows 11
        - Browser: Chrome 120
        - Node: 20.10
        - Python: 3.12
    validations:
      required: true
