name: Quality gates
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:admin
      - run: pnpm build:consumer

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/backend/requirements*.txt
      - run: pip install -r requirements-dev.lock.txt
      - run: python -m pytest -q
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - run: python -m alembic upgrade head --sql > /tmp/migration.sql
      - run: docker compose config --quiet
        working-directory: .
